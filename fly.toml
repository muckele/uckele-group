app = "uckele-group"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_PUBLIC_SITE_URL = "https://www.uckelegroup.com"
    VITE_PUBLIC_CONTACT_EMAIL = "mathew@uckelegroup.com"
    VITE_PUBLIC_CONTACT_PHONE = "914.361.9153"
    VITE_PUBLIC_LINKEDIN_URL = "https://www.linkedin.com/in/mathew-uckele"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  PUBLIC_SITE_URL = "https://www.uckelegroup.com"
  VITE_PUBLIC_SITE_URL = "https://www.uckelegroup.com"
  OUTBOUND_HTTP_TIMEOUT_MS = "10000"
  STORAGE_PROVIDER = "sqlite"
  SQLITE_PATH = "/data/uckele-group.sqlite"
  SECURE_DOCUMENTS_STORAGE_DIR = "/data/secure-documents"
  BACKUP_ENABLED = "true"
  BACKUP_DIRECTORY = "/data/backups"
  BACKUP_RETENTION_DAYS = "14"
  BACKUP_RETENTION_COUNT = "14"
  BACKUP_DAILY_TIME = "03:30"
  BACKUP_TIMEZONE = "America/Los_Angeles"
  DEAL_HUNTER_DAILY_EMAIL_ENABLED = "true"
  DEAL_HUNTER_DAILY_EMAIL_TIME = "08:00"
  DEAL_HUNTER_DAILY_EMAIL_TIMEZONE = "America/Los_Angeles"
  DEAL_HUNTER_DAILY_EMAIL_MARKER_DIR = "/data/deal-hunter-daily-email"
  DEAL_HUNTER_CIM_FOLLOW_UP_ENABLED = "true"
  DEAL_HUNTER_CIM_FOLLOW_UP_CHECK_INTERVAL_MS = "3600000"
  DEAL_HUNTER_CIM_FOLLOW_UP_DELAYS_HOURS = "48,72,96"
  DEAL_HUNTER_CIM_FOLLOW_UP_MAX_COUNT = "3"
  DEAL_HUNTER_CIM_FOLLOW_UP_WEEKDAYS_ONLY = "true"
  DEAL_HUNTER_CIM_FOLLOW_UP_TIMEZONE = "America/Los_Angeles"
  DEAL_HUNTER_CIM_AUTOMATION_STAGE = "1"
  DEAL_HUNTER_MAX_SOURCE_RECORDS = "8000"
  DEAL_HUNTER_AIRTABLE_SHARED_MAX_PAYLOAD_BYTES = "12582912"
  ANALYTICS_ENABLED = "true"
  ANALYTICS_RETENTION_DAYS = "90"
  ANALYTICS_RATE_LIMIT_WINDOW_MS = "60000"
  ANALYTICS_RATE_LIMIT_MAX = "120"

[http_service]
  internal_port = 8787
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/ready"

[[mounts]]
  source = "uckele_group_data"
  destination = "/data"
  snapshot_retention = 14

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
