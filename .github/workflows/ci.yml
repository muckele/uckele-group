name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, codex/bounded-recovery-capture]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       !(github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository &&
         github.head_ref == 'codex/bounded-recovery-capture'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - name: Qualify bounded recovery capture on Linux with synthetic data
        run: |
          node scripts/qualify-recovery-capture.js --database-mib 154
          node scripts/qualify-recovery-capture.js --test-timeout
      - name: Prepare disposable PostgreSQL test dependency
        run: docker pull postgres:16
      - name: Verify atomic restore on fresh and upgraded isolated PostgreSQL
        env:
          CRM_RESTORE_POSTGRES_INTEGRATION: '1'
        run: node --test test/crmRestorePostgres.test.js
      - run: npm run test:ui
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:owner-flow
      - run: npm run test:owner-volume
      - run: npm run test:browser-volume

  recovery-capture-qualification:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/bounded-recovery-capture') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/bounded-recovery-capture')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node --test test/recoveryCapture.test.js test/recoverySource.test.js
      - name: Qualify bounded recovery capture with synthetic data only
        run: |
          node scripts/qualify-recovery-capture.js --database-mib 154
          node scripts/qualify-recovery-capture.js --test-timeout
