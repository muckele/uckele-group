name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.9'
          cache-dependency-path: tools/p10b-machine-client/go.sum
      - working-directory: tools/p10b-machine-client
        run: go test ./... && go build -o /tmp/p10b-machine-client .
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
